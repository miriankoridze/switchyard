name: Idea or feature request
description: Something you'd like Switchyard to do.
labels: [idea]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe your show and the problem, not only the feature. Real examples help most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The feature, source or output you have in mind.
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another app, a workaround, or not at all.
